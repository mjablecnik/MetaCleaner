app = 'metacleaner-server-stage'
primary_region = 'fra'

[build]

[env]
  APP_ENV = "production"
  PORT = "8080"
  TEMP_STORAGE_PATH = "/tmp/metacleaner"
  RETENTION_PERIOD = "1h"
  MAX_FILE_SIZE = "524288000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/api/health"

[[mounts]]
  source = "metacleaner_tmp"
  destination = "/tmp/metacleaner"
