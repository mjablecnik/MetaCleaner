server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # WASM files — serve with correct MIME type before SPA fallback
    location ~* \.wasm$ {
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy: restricts script/style sources and — critically — connect-src,
    # which limits where any injected JS can exfiltrate data (e.g. localStorage tokens).
    # 'unsafe-inline' is required for SvelteKit hydration scripts and Tailwind utility styles;
    # tighten to nonce-based CSP once a SvelteKit nonce middleware is in place.
    # connect-src allows https:/wss: broadly because PUBLIC_API_URL is resolved at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    # HSTS: instruct browsers to always use HTTPS for 2 years (fly.toml force_https handles the
    # initial redirect; this header prevents SSL-stripping on subsequent requests).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}
