server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Prerendered pages get their own .html; unmatched routes return a real 404
    # with the styled fallback page so search engines don't soft-404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 =404 /200.html;
    location = /200.html {
        internal;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # script-src is deliberately omitted here: SvelteKit's prerendered HTML embeds
    # an inline bootstrap <script> whose sha256 hash changes with every build.
    # kit.csp (mode:'hash') in vite.config.ts injects a <meta http-equiv="CSP">
    # with the correct sha256 into every prerendered page; that meta CSP governs
    # scripts. Adding script-src here would override the meta CSP and block the
    # bootstrap. All other fetch directives are still enforced below.
    add_header Content-Security-Policy "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}
