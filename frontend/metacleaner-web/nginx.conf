server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve real files when they exist, otherwise hand off to the
    # client-side router (200.html). This is required because Paraglide uses
    # URL-prefix routing (/cs/, /cs/pricing, etc.) and those paths don't exist
    # as directories on disk.
    location / {
        try_files $uri $uri.html /200.html;
    }

    # Cache static assets
    # Security headers must be re-declared here: nginx add_header directives are
    # NOT inherited by a child location block that defines any add_header of its
    # own. Without this, asset responses would be served without HSTS, nosniff,
    # X-Frame-Options, Referrer-Policy, and CSP.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://asxkfzpsxglifgmtgujx.supabase.co; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # script-src is deliberately omitted here: SvelteKit's prerendered HTML embeds
    # an inline bootstrap <script> whose sha256 hash changes with every build.
    # kit.csp (mode:'hash') in vite.config.ts injects a <meta http-equiv="CSP">
    # with the correct sha256 into every prerendered page; that meta CSP governs
    # scripts. Adding script-src here would override the meta CSP and block the
    # bootstrap. All other fetch directives are still enforced below.
    add_header Content-Security-Policy "style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://asxkfzpsxglifgmtgujx.supabase.co; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
}
