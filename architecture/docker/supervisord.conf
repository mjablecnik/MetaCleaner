[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:structurizr]
command=java -Dserver.port=8081 --enable-native-access=ALL-UNNAMED -jar /opt/structurizr/structurizr.war local /usr/local/structurizr
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
