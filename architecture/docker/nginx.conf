server {
    listen 8080;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host "localhost:8081";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Accept-Encoding "";

        # Rewrite redirect headers
        proxy_redirect ~^http://localhost(:\d+)?/(.*)$ /$2;

        # Rewrite absolute URLs in HTML/JS responses
        sub_filter 'http://localhost:8081' '';
        sub_filter 'http://localhost:8080' '';
        sub_filter 'http://localhost' '';
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/css;

        proxy_buffering off;
    }
}
